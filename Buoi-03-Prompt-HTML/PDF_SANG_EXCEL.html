<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>PDF sang Excel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #F5F2EA; color: #14213D; }
  header { background: #14213D; color: #F5F2EA; padding: 18px 28px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 4px 0 0; color: #C9D3E3; font-size: 14px; }
  main { padding: 24px 28px; max-width: 1200px; margin: auto; }
  #drop { border: 3px dashed #E07A2E; border-radius: 14px; background: #FFFDF8; padding: 36px; text-align: center; font-size: 18px; }
  #drop.over { background: #FCE9D7; }
  button { font-size: 16px; padding: 10px 22px; border: 0; border-radius: 8px; cursor: pointer; margin: 6px; }
  .cam { background: #E07A2E; color: #fff; font-weight: bold; }
  .xanh { background: #14213D; color: #fff; font-weight: bold; }
  button:disabled { opacity: .4; cursor: default; }
  #tiendo { margin: 18px 0 6px; font-size: 15px; min-height: 20px; }
  progress { width: 100%; height: 16px; }
  .tab { display: inline-block; padding: 8px 14px; margin: 12px 6px 0 0; background: #EAE4D6; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; }
  .tab.on { background: #14213D; color: #fff; }
  #xem { background: #fff; border: 1px solid #DED5C1; max-height: 520px; overflow: auto; }
  table { border-collapse: collapse; font-size: 13px; }
  td, th { border: 1px solid #DED5C1; padding: 4px 8px; white-space: nowrap; }
  th { background: #EAE4D6; position: sticky; top: 0; }
  td.so { text-align: right; color: #0B5D3B; }
  .ghichu { font-size: 13px; color: #4A5568; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Chuyển PDF sang Excel</h1>
  <p>Đọc được cả PDF có chữ và PDF scan (OCR tiếng Việt). File đọc ngay trên máy, không gửi đi đâu.</p>
</header>
<main>
  <div id="drop">
    Kéo thả file PDF hoặc ảnh chụp (JPG, PNG) vào đây<br><br>
    <button class="cam" id="nutChon">Chọn file</button>
    <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.tif,.tiff" multiple hidden>
  </div>
  <div id="tiendo"></div>
  <progress id="thanh" value="0" max="1" hidden></progress>
  <div>
    <button class="xanh" id="nutTai" disabled>Tải Excel</button>
    <button id="nutXoa" disabled>Làm lại</button>
  </div>
  <div id="cacTab"></div>
  <div id="xem"></div>
  <p class="ghichu">Trang scan đọc mất vài giây mỗi trang. Bản scan mờ hoặc nghiêng thì chữ có thể sai, nhớ dò lại số tiền và mã số thuế.</p>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
let ketQua = [];      // [{ten, hang: [[...], ...]}]
let ocrWorker = null;

$("nutChon").onclick = () => $("file").click();
$("file").onchange = e => xuLy([...e.target.files]);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove("over");
  xuLy([...e.dataTransfer.files].filter(f => /\.(pdf|jpe?g|png|webp|tiff?)$/i.test(f.name)));
};
$("nutXoa").onclick = () => { ketQua = []; veBang(); $("tiendo").textContent = ""; $("nutTai").disabled = $("nutXoa").disabled = true; };
$("nutTai").onclick = taiExcel;

function baoTienDo(chu, giaTri, toiDa) {
  $("tiendo").textContent = chu;
  const t = $("thanh"); t.hidden = false;
  if (toiDa) { t.max = toiDa; t.value = giaTri; }
}

async function layOcr() {
  if (!ocrWorker) {
    baoTienDo("Đang tải bộ đọc chữ tiếng Việt (lần đầu hơi lâu)...");
    ocrWorker = await Tesseract.createWorker(["vie", "eng"], 1);
  }
  return ocrWorker;
}

async function xuLy(files) {
  if (!files.length) return;
  $("nutTai").disabled = $("nutXoa").disabled = true;
  for (let i = 0; i < files.length; i++) {
    const f = files[i], ten = f.name.replace(/\.[^.]+$/, "");
    try {
      const hang = [];
      if (/\.pdf$/i.test(f.name)) {
        const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        for (let p = 1; p <= pdf.numPages; p++) {
          baoTienDo(`File ${i + 1}/${files.length}: ${f.name} – trang ${p}/${pdf.numPages}`, p - 1, pdf.numPages);
          const trang = await pdf.getPage(p);
          let tu = await layChuThat(trang);
          if (tu.length < 5) {
            baoTienDo(`File ${i + 1}/${files.length}: ${f.name} – trang ${p}/${pdf.numPages} (scan, đang OCR...)`, p - 1, pdf.numPages);
            tu = await docOcr(await veTrang(trang));
          }
          for (const h of xepBang(tu)) hang.push([p, ...h]);
        }
      } else {
        baoTienDo(`File ${i + 1}/${files.length}: ${f.name} (ảnh, đang OCR...)`, 0, 1);
        const tu = await docOcr(anhRaCanvas(await createImageBitmap(f)));
        for (const h of xepBang(tu)) hang.push([1, ...h]);
      }
      ketQua.push({ ten, hang });
    } catch (err) {
      ketQua.push({ ten, hang: [["Lỗi", "Không đọc được file: " + err.message]] });
    }
  }
  baoTienDo(`Xong ${files.length} file. Xem trước bên dưới rồi bấm Tải Excel.`, 1, 1);
  $("nutTai").disabled = $("nutXoa").disabled = false;
  veBang(ketQua.length - 1);
}

// Chữ thật trong PDF -> danh sách chữ có toạ độ (cùng dạng với OCR)
async function layChuThat(trang) {
  const vp = trang.getViewport({ scale: 2 });
  const nd = await trang.getTextContent();
  const tu = [];
  for (const it of nd.items) {
    const text = (it.str || "").trim();
    if (!text) continue;
    const [x, y] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
    const cao = Math.hypot(it.transform[2], it.transform[3]) * 2 || 20;
    const rong = (it.width || text.length * cao / 4) * 2;
    tu.push({ text, confidence: 100, bbox: { x0: x, x1: x + rong, y0: y - cao, y1: y } });
  }
  return tu;
}

// Trang PDF -> ảnh (phóng 2 lần cho OCR rõ)
async function veTrang(trang) {
  const vp = trang.getViewport({ scale: 2 });
  const cv = document.createElement("canvas");
  cv.width = vp.width; cv.height = vp.height;
  await trang.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
  return cv;
}

// Ảnh chụp -> canvas nền trắng, cạnh dài khoảng 1800–2600 điểm ảnh
function anhRaCanvas(bm) {
  const dai = Math.max(bm.width, bm.height);
  let k = 1;
  if (dai < 1800) k = Math.min(2.5, 1800 / dai);
  if (dai * k > 2600) k = 2600 / dai;
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(bm.width * k)); cv.height = Math.max(1, Math.round(bm.height * k));
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bm, 0, 0, cv.width, cv.height);
  return cv;
}

async function docOcr(canvas) {
  const w = await layOcr();
  const { data } = await w.recognize(canvas);
  return data.words || [];
}

// Sửa chữ o/O OCR đọc nhầm trong dãy số thành 0
function suaSo(s) {
  return s.replace(/[0-9oO]{2,}/g, t => /\d/.test(t) ? t.replace(/[oO]/g, "0") : t);
}

// Gom chữ thành hàng (cùng độ cao) và cột (mép trái thẳng hàng)
function xepBang(words) {
  const tu = words.filter(w => w.text && w.text.trim() && w.confidence >= 35);
  if (!tu.length) return [];
  const giua = w => (w.bbox.y0 + w.bbox.y1) / 2;
  tu.sort((a, b) => giua(a) - giua(b));
  const caos = tu.map(w => w.bbox.y1 - w.bbox.y0).sort((a, b) => a - b);
  const caoTB = caos[Math.floor(caos.length / 2)] || 12;
  const dong = [];
  for (const w of tu) {
    const d = dong[dong.length - 1];
    if (!d || Math.abs(giua(w) - d.y) > caoTB * 0.65) dong.push({ y: giua(w), tu: [w] });
    else { d.tu.push(w); d.y = d.tu.reduce((s, x) => s + giua(x), 0) / d.tu.length; }
  }
  // Chữ sát nhau trong một dòng ghép thành một cụm (một ô)
  for (const d of dong) {
    d.tu.sort((a, b) => a.bbox.x0 - b.bbox.x0);
    const cum = [];
    for (const w of d.tu) {
      const c = cum[cum.length - 1];
      if (c && w.bbox.x0 - c.x1 < caoTB * 0.9) { c.text += " " + w.text; c.x1 = Math.max(c.x1, w.bbox.x1); }
      else cum.push({ text: w.text, x0: w.bbox.x0, x1: w.bbox.x1 });
    }
    d.cum = cum;
  }
  // Mép trái các cụm thẳng hàng nhau là một cột
  const khe = caoTB * 1.2;
  const mep = [];
  for (const c of dong.flatMap(d => d.cum).sort((a, b) => a.x0 - b.x0))
    if (!mep.length || c.x0 - mep[mep.length - 1] > khe) mep.push(c.x0);
  return dong.map(d => {
    const o = Array(mep.length).fill("");
    for (const c of d.cum) {
      let k = 0;
      mep.forEach((m, i) => { if (m <= c.x0 + 1) k = i; });
      while (o[k] !== "" && k < o.length - 1) k++;
      o[k] = suaSo((o[k] + " " + c.text).trim());
    }
    while (o.length && o[o.length - 1] === "") o.pop();
    return o.map(chuyenSo);
  }).filter(h => h.some(v => v !== ""));
}

// 1.234.567 -> số. Mã số thuế, số có 0 ở đầu, số ngắn (STT, tiểu mục) -> giữ chữ
function chuyenSo(s) {
  const t = s.replace(/\s/g, "");
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) return Number(t.replace(/\./g, "").replace(",", "."));
  if (/^-?\d{1,3}(,\d{3})+$/.test(t)) return Number(t.replace(/,/g, ""));
  if (/^-?[1-9]\d{4,8}$/.test(t)) return Number(t);
  return s;
}

function veBang(chon) {
  $("cacTab").innerHTML = ""; $("xem").innerHTML = "";
  if (!ketQua.length) return;
  ketQua.forEach((kq, i) => {
    const tab = document.createElement("span");
    tab.className = "tab" + (i === chon ? " on" : "");
    tab.textContent = kq.ten;
    tab.onclick = () => veBang(i);
    $("cacTab").appendChild(tab);
  });
  const kq = ketQua[chon], soCot = Math.max(...kq.hang.map(h => h.length), 1);
  let html = "<table><tr><th>Trang</th>";
  for (let c = 1; c < soCot; c++) html += `<th>Cột ${c}</th>`;
  html += "</tr>";
  for (const h of kq.hang.slice(0, 500)) {
    html += "<tr>";
    for (let c = 0; c < soCot; c++) {
      const v = h[c] ?? "";
      html += typeof v === "number" ? `<td class="so">${v.toLocaleString("vi-VN")}</td>` : `<td>${String(v).replace(/</g, "&lt;")}</td>`;
    }
    html += "</tr>";
  }
  $("xem").innerHTML = html + "</table>" + (kq.hang.length > 500 ? `<p class="ghichu">Đang xem 500/${kq.hang.length} dòng. File Excel có đủ.</p>` : "");
}

function taiExcel() {
  const wb = XLSX.utils.book_new(), daDung = new Set();
  for (const kq of ketQua) {
    let ten = kq.ten.replace(/[\\\/\?\*\[\]:]/g, "_").slice(0, 28) || "Sheet", goc = ten, n = 2;
    while (daDung.has(ten.toLowerCase())) ten = goc.slice(0, 25) + "_" + n++;
    daDung.add(ten.toLowerCase());
    const soCot = Math.max(...kq.hang.map(h => h.length), 1);
    const dau = ["Trang"]; for (let c = 1; c < soCot; c++) dau.push("Cột " + c);
    const ws = XLSX.utils.aoa_to_sheet([dau, ...kq.hang]);
    for (const k in ws) if (k[0] !== "!" && ws[k].t === "n") ws[k].z = "#,##0";
    XLSX.utils.book_append_sheet(wb, ws, ten);
  }
  XLSX.writeFile(wb, "PDF_SANG_EXCEL.xlsx");
}
</script>
</body>
</html>
